name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.10 is the minimum in pyproject.toml (requires-python).
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Core deps + pytest only. The GPU/model extras (asr, qwen, mfa, llm)
      # are deliberately not installed: the tests don't need them.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests/ -q

  # Timing accuracy on real audio with a real engine. Linux only: it needs
  # ffmpeg and downloads a 40 MB Vosk model, so it is kept out of the
  # cross-platform matrix above.
  accuracy:
    name: accuracy (real audio, Vosk)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Download Vosk model
        run: |
          curl -sSfL --retry 3 -o vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q vosk.zip -d "$RUNNER_TEMP"

      - name: Accuracy test
        env:
          WORDALIGN_TEST_VOSK_MODEL: ${{ runner.temp }}/vosk-model-small-en-us-0.15
          WORDALIGN_REQUIRE_ACCURACY: "1"
        run: python -m pytest tests/test_accuracy_real_audio.py -q -s
