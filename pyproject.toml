[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wordalign"
version = "2.2.1"
description = "Word-accurate subtitle alignment and transcription for audio and video"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "langdetect>=1.0.9",
    "librosa>=0.10",
    "numpy>=1.24",
    "onnxruntime>=1.17",
    "psutil>=5.9",
    "srt>=3.5",
    "vosk>=0.3.45",
]

[project.optional-dependencies]
asr = [
    "torch>=2.1",
    "whisperx>=3.1",
]
qwen = ["qwen-asr>=0.0.6"]
mfa = ["montreal-forced-aligner>=3.4", "textgrid>=1.5"]
llm = ["transformers>=4.40"]
docx = ["python-docx>=1.1"]
dev = ["pytest>=7.4"]
# Bad-audio benchmark (wordalign-bench): public datasets via the HF hub.
bench = ["huggingface_hub>=0.24", "pyarrow>=14", "soundfile>=0.12"]

[project.scripts]
wordalign = "wordalign.cli_v2:main"
wordalign-bench = "wordalign.robustness.__main__:main"

[tool.setuptools.packages.find]
include = ["wordalign*"]
namespaces = true

[tool.setuptools.package-data]
wordalign = ["data/*.json", "profiles/*.json", "gui/*.html"]
